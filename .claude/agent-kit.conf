# agent-kit config for this repo. Read by the agent-kit plugin's hooks (bash).
# The hooks do nothing in a repo without this file. They update with the plugin; this file doesn't.

# Short-term "where we left off" note, overwritten at the end of each task.
HANDOFF="docs/handoff.md"

# Long-term work ledger with [ ] / [~] / [x] status items.
PLAN="PLAN.md"

# Run at the end of a turn when BUILD_PATHS changed. Empty = no build check.
# Takes about 10 seconds. Needs internet: the build downloads the two Google fonts.
BUILD_CMD="npm run --silent lint && npm run --silent build"
BUILD_PATHS="app components content lib public next.config.ts package.json tsconfig.json"

# 'glob|reason' — edits to matching repo-relative paths are always blocked.
BLOCK=(
  '.next/*|Build output. Change the source and rebuild.'
  'package-lock.json|npm writes this file. Use npm install.'
)

# 'glob|reason' — creating NEW files at matching paths is blocked (edits are fine).
BLOCK_NEW=(
  'public/products/*.pdf|Anything in public/ can be downloaded by anyone. Paid PDFs need the private delivery folder (PLAN.md step 5).'
  'tailwind.config.*|Styling is plain CSS with tokens in app/theme.css (docs/decisions.md).'
  'AGENTS.override.md|CLAUDE.md is the only instructions file.'
  '*.pem|No secrets in git: keys and tokens go in a password manager or a secrets store.'
  '*.key|No secrets in git: keys and tokens go in a password manager or a secrets store.'
  '*credentials*|No secrets in git: keys and tokens go in a password manager or a secrets store.'
)

# UI gate: edits to UI_PATHS are blocked until UI_SKILL has been loaded this session
# (Claude's Skill tool or the user typing /<UI_SKILL>). Empty UI_SKILL = no gate.
# Globs are repo-relative; '*' also crosses '/'. UI_EXCEPT carves out tests etc.
UI_SKILL="impeccable"
UI_PATHS=(
  'app/*.tsx'
  'app/*.css'
  'components/*'
  'art/*'
  'public/*'
  'DESIGN.md'
)
UI_EXCEPT=(
  '*.test.tsx'
  '*.spec.tsx'
  '*.test.jsx'
  '*.spec.jsx'
)

# More gates like the UI one, 'skill|glob': edits to glob need skill loaded this session.
# A file under several gates needs all their skills. GATE_EXCEPT (and UI_EXCEPT) are never gated.
# Shopify: 'shopify|*.liquid' 'shopify|*.graphql' 'shopify|*.gql'
SKILL_GATES=(
)
GATE_EXCEPT=(
)

# Third-party plugins this repo uses, 'plugin@marketplace' or 'plugin@marketplace|github/repo'
# (the repo is needed unless the marketplace is claude-plugins-official). install.sh enables
# them in .claude/settings.json; agent-kit itself is always enabled. Stack bundles:
#   frontend: 'impeccable@impeccable|pbakaus/impeccable'
#   Shopify:  'shopify-ai-toolkit@claude-plugins-official' 'liquid-skills@claude-plugins-official'
#             'liquid-lsp@claude-plugins-official' (themes; needs the Shopify CLI)
PLUGINS=(
  'impeccable@impeccable|pbakaus/impeccable'
)
